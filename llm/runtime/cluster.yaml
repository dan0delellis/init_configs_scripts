version: "3.9"
services:
 intel-vllm:
  image: vllm/vllm-openai-xpu:v0.27.0-x86_64
  container_name: vllm-sycl
  devices:
   - /dev/dri:/dev/dri
  environment:
   - DEVICE=xpu
   - ONEAPI_DEVICE_SELECTOR=level_zero:0
   - VLLM_CACHE_ROOT=/models/vllm
  volumes:
   - /dev/dri/by-path:/dev/dri/by-path
   - /mnt/clankers:/models
  ports:
   - "8000:8000"
  ipc: host
  restart: no
  command: RedHatAI/DeepSeek-R1-Distill-Qwen-32B-quantized.w4a16
   --port 8000
   --host 0.0.0.0
   --download-dir /models
   --kv-cache-dtype fp8
   --max-model-len auto
   --gpu-memory-utilization 0.90
   --trust-remote-code

 nvidia-llama:
  image: llama-cuda:20260820-1
  container_name: llama-cuda
  environment:
   - CUDA_VISIBLE_DEVICES=0
  volumes:
   - /mnt/clankers:/models
  ports:
   - "8080:8080"
  ipc: host
  restart: no
  deploy:
    resources:
      reservations:
        devices:
          - driver: cdi
            capabilities: [gpu]
            device_ids:
              - nvidia.com/gpu=all
  command: /app/cuda/llama-server
    --model /models/qwen2.5-coder-7b-instruct-q5_k_m.gguf
    --port 8080
    --host 0.0.0.0
    --metrics
    --ctx-size 4096
    --n-gpu-layers 99

 open-webui:
  image: openwebui/open-webui:latest-slim
  container_name: open-webui
  ports:
    - "3000:8080"
  volumes:
    - open-webui-data:/app/backend/data
  environment:
    - OPENAI_API_BASE_URLS=http://vllm-sycl:8000/v1;http://llama-cuda:8080/v1
    - OPENAI_API_KEYS=vllm-token-not-used;llamacpp-token-not-used
  restart: no
  depends_on:
    - intel-vllm
    - nvidia-llama

volumes:
  open-webui-data:
