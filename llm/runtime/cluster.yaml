version: "3.9"
services:
 intel-gpu:
  image: dandelellis/custom-llama-general:latest
  container_name: intel
  devices:
   - /dev/dri:/dev/dri
  volumes:
   - /dev/dri/by-path:/dev/dri/by-path
   - /mnt/clankers:/models
  ports:
   - "8000:8080"
  ipc: host
  restart: no
  command: /app/bin/llama-wrapper
    --port ${BIG_PORT:-8080}
    --backend ${BIG_BACKEND:-sycl}
    --model ${BIG_MODEL}
    --ctx ${BIG_CONTEXT:-60000}
    --cache-type-k ${BIG_CACHE_K:-q8_0}
    --cache-type-v ${BIG_CACHE_V:-q4_0}

 nvidia-gpu:
  #image: llama-cuda:20260820-1
  image: horker:latest
  container_name: nvidia
  environment:
   - CUDA_VISIBLE_DEVICES=0
  volumes:
   - /mnt/clankers:/models
  ports:
   - "8001:8080"
  ipc: host
  restart: no
  deploy:
    resources:
      reservations:
        devices:
          - driver: cdi
            capabilities: [gpu]
            device_ids:
              - nvidia.com/gpu=all
  command: /app/cuda/llama-server
    --model /models/qwen2.5-coder-7b-instruct-q5_k_m.gguf
    --port 8080
    --host 0.0.0.0
    --metrics
    --ctx-size 8192
    --n-gpu-layers 99

 open-webui:
  image: openwebui/open-webui:latest-slim
  container_name: open-webui
  ports:
    - "3000:8080"
  volumes:
    - open-webui-data:/app/backend/data
  environment:
    - OPENAI_API_BASE_URLS=http://vllm-sycl:8000/v1;http://llama-cuda:8080/v1
    - OPENAI_API_KEYS=vllm-token-not-used;llamacpp-token-not-used
  restart: no
  depends_on:
    - intel-vllm
    - nvidia-llama

volumes:
  open-webui-data:
