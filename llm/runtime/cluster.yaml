version: "3.9"
services:
 intel-vllm:
  image: vllm/vllm-openai-xpu:v0.27.0-x86_64
  container_name: vllm
  devices:
   - /dev/dri:/dev/dri
  environment:
   - DEVICE=xpu
   - ONEAPI_DEVICE_SELECTOR=level_zero:0
   - VLLM_CACHE_ROOT=/models/vllm
  volumes:
   - /dev/dri/by-path:/dev/dri/by-path
   - /mnt/clankers:/models
  ports:
   - "8000:8000"
  ipc: host
  restart: no
  command: RedHatAI/DeepSeek-R1-Distill-Qwen-32B-quantized.w4a16
   --port 8000
   --host 0.0.0.0
   --download-dir /models
   --kv-cache-dtype fp8
   --max-model-len auto
   --gpu-memory-utilization 0.90
   --trust-remote-code
 nvidia-llama:
  command: /app/cuda/llama-server
    --model /models/qwen2.5-coder-7b-instruct-q5_k_m.gguf
    --port 8080
    --host 0.0.0.0
    --metrics
    --ctx-size 4096
    --n-gpu-layers 99
  image: llama-cuda:20260820-1
  container_name: llama
  environment:
   - CUDA_VISIBLE_DEVICES=0
  volumes:
   - /mnt/clankers:/models
  ports:
   - "8080:8080"
  deploy:
    resources:
      reservations:
        devices:
          - driver: cdi
            capabilities: [gpu]
            device_ids:
              - nvidia.com/gpu=all
  ipc: host
  restart: no
